name: CI

on:
  push:
    branches: ["main", "v0-streamlit-dashboard"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Validar sintaxis y módulos Streamlit
        run: |
          python -m compileall -q app.py src services ui views
          python -c "from services.optimization_service import load_context; from views.dashboard import render_dashboard; from views.planificacion import render_planificacion; from views.gantt import render_gantt; from views.mapa import render_mapa; c=load_context(); assert len(c.obras) == 44"

      - name: Prueba de integración con las 44 inspecciones
        run: |
          python main.py \
            --min-days 2 \
            --max-days 6 \
            --time-limit 10 \
            --output-dir /tmp/model-output
