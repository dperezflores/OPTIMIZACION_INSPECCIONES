name: CI

on:
  push:
    branches: ["main", "v0-streamlit-dashboard", "v0-1-proyectos-sin-acompanante"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Validar sintaxis y módulos Streamlit
        run: |
          python -m compileall -q app.py src services ui views
          python -c "from services.optimization_service import load_context; from views.dashboard import render_dashboard; from views.planificacion import render_planificacion; from views.gantt import render_gantt; from views.mapa import render_mapa; c=load_context(); assert len(c.obras) == 44; assert sum(o.tipo_revision == 'PROYECTO_DOCUMENTAL' for o in c.obras) == 17"

      - name: Mínimo factible V1
        run: |
          python main.py \
            --min-days 1 \
            --max-days 6 \
            --time-limit 15 \
            --output-dir /tmp/model-output-min

      - name: Comparar escenario 4 días
        run: |
          python main.py \
            --min-days 4 \
            --max-days 4 \
            --time-limit 15 \
            --output-dir /tmp/model-output-4

      - name: Comparar escenario 5 días
        run: |
          python main.py \
            --min-days 5 \
            --max-days 5 \
            --time-limit 15 \
            --output-dir /tmp/model-output-5

      - name: Integración V4 CP-SAT + ALNS con 44 actividades
        run: |
          python - <<'PY'
          from services.optimization_service import (
              OptimizationRequest,
              TRAVEL_PROVIDER_HAVERSINE,
              load_context,
              run_optimization,
          )
          context = load_context()
          run = run_optimization(
              context,
              OptimizationRequest(
                  min_days=4,
                  max_days=4,
                  time_limit_seconds=15,
                  travel_provider=TRAVEL_PROVIDER_HAVERSINE,
                  compare_all_scenarios=False,
                  use_alns=True,
                  alns_iterations=2,
                  alns_repair_time_seconds=1.0,
                  alns_destroy_fraction=0.20,
              ),
          )
          assert run.quality_best is not None
          assert run.refined_best is not None
          assert run.refined_best.factible
          assert len(run.refined_best.plan) == 44
          assert run.refined_best.dias == 4
          assert run.refined_best.operational_cost <= run.quality_best.operational_cost + 1e-9
          print('CP-SAT:', round(run.quality_best.operational_cost, 2))
          print('ALNS:', round(run.refined_best.operational_cost, 2))
          PY
