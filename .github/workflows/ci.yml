name: CI

on:
  push:
    branches: ["main", "v0-streamlit-dashboard", "v0-1-proyectos-sin-acompanante"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Validar sintaxis y módulos Streamlit
        run: |
          python -m compileall -q app.py src services ui views
          python -c "from services.optimization_service import load_context; from views.dashboard import render_dashboard; from views.planificacion import render_planificacion; from views.gantt import render_gantt; from views.mapa import render_mapa; c=load_context(); assert len(c.obras) == 44; assert sum(o.tipo_revision == 'PROYECTO_DOCUMENTAL' for o in c.obras) == 17"

      - name: Mínimo factible V1
        run: |
          python main.py \
            --min-days 1 \
            --max-days 6 \
            --time-limit 15 \
            --output-dir /tmp/model-output-min

      - name: Comparar escenario 4 días
        run: |
          python main.py \
            --min-days 4 \
            --max-days 4 \
            --time-limit 15 \
            --output-dir /tmp/model-output-4

      - name: Comparar escenario 5 días
        run: |
          python main.py \
            --min-days 5 \
            --max-days 5 \
            --time-limit 15 \
            --output-dir /tmp/model-output-5

      - name: Integración V5 CP-SAT + ALNS + ruteo vehicular con 44 actividades
        run: |
          python - <<'PY'
          from collections import Counter
          from dataclasses import replace

          from services.optimization_service import (
              OptimizationRequest,
              TRAVEL_PROVIDER_HAVERSINE,
              load_context,
              run_optimization,
          )
          from src.distance_matrix import build_travel_matrix
          from src.vehicle_planner import calculate_legacy_vehicle_plan, calculate_vehicle_plan

          context = load_context()
          context.config = replace(
              context.config,
              vehicle_routing_time_limit_seconds=0.6,
          )

          run = run_optimization(
              context,
              OptimizationRequest(
                  min_days=4,
                  max_days=4,
                  time_limit_seconds=30,
                  travel_provider=TRAVEL_PROVIDER_HAVERSINE,
                  compare_all_scenarios=False,
                  use_alns=True,
                  alns_iterations=2,
                  alns_repair_time_seconds=1.0,
                  alns_destroy_fraction=0.20,
              ),
          )
          assert run.quality_best is not None
          assert run.refined_best is not None
          assert run.refined_best.factible
          assert len(run.refined_best.plan) == 44
          assert run.refined_best.dias == 4
          assert run.refined_best.operational_cost <= run.quality_best.operational_cost + 1e-9

          counts = Counter(item.dia for item in run.quality_best.plan)
          per_day = [counts.get(day, 0) for day in range(1, 5)]
          day_max = max(per_day)
          day_min = min(per_day)

          cfg = replace(context.config, time_limit_seconds=30)
          matrix = build_travel_matrix(context.obras, cfg)
          final_plan = run.refined_best.plan
          legacy = calculate_legacy_vehicle_plan(final_plan, matrix, cfg)
          routed = calculate_vehicle_plan(final_plan, matrix, cfg)

          assert routed.vehicles_required_peak <= legacy.vehicles_required_peak
          assert routed.solo_legs <= legacy.solo_legs

          print('CP-SAT:', round(run.quality_best.operational_cost, 2))
          print('ALNS:', round(run.refined_best.operational_cost, 2))
          print('ACTIVIDADES_POR_DIA:', per_day)
          print('DIA_MAX_MIN:', day_max, day_min)
          print('VEHICULOS_PEAK_ANTES_DESPUES:', legacy.vehicles_required_peak, routed.vehicles_required_peak)
          print('VIAJES_SOLO_ANTES_DESPUES:', legacy.solo_legs, routed.solo_legs)
          print('KM_VEHICULO_ANTES_DESPUES:', round(legacy.vehicle_km, 1), round(routed.vehicle_km, 1))
          PY
