name: CI

on:
  push:
    branches: ["main", "v0-streamlit-dashboard", "v0-1-proyectos-sin-acompanante"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Validar sintaxis y módulos Streamlit
        run: |
          python -m compileall -q app.py src services ui views
          python -c "from services.optimization_service import load_context; from views.dashboard import render_dashboard; from views.planificacion import render_planificacion; from views.gantt import render_gantt; from views.mapa import render_mapa; c=load_context(); assert len(c.obras) == 44; assert sum(o.tipo_revision == 'PROYECTO_DOCUMENTAL' for o in c.obras) == 17"

      - name: Mínimo factible V1
        run: |
          python main.py \
            --min-days 1 \
            --max-days 6 \
            --time-limit 15 \
            --output-dir /tmp/model-output-min

      - name: Comparar escenario 4 días
        run: |
          python main.py \
            --min-days 4 \
            --max-days 4 \
            --time-limit 15 \
            --output-dir /tmp/model-output-4

      - name: Comparar escenario 5 días
        run: |
          python main.py \
            --min-days 5 \
            --max-days 5 \
            --time-limit 15 \
            --output-dir /tmp/model-output-5
